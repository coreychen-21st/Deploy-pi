name: Deploy EWA Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        type: choice
        required: true
        default: 'production'
        options:
          - production
          - staging
      location:
        description: 'Azure Region'
        type: string
        required: true
        default: 'japanwest'
  push:
    branches:
      - main
    paths:
      - 'bicep/**'
      - '.github/workflows/deploy-infrastructure.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  LOCATION: ${{ github.event.inputs.location || 'japanwest' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
  ENTRA_MANAGER_GROUP_OBJECT_ID: ${{ secrets.ENTRA_MANAGER_GROUP_OBJECT_ID }}
  ENTRA_READER_GROUP_OBJECT_ID: ${{ secrets.ENTRA_READER_GROUP_OBJECT_ID }}
  ENTRA_WEBAPPEXECUTOR_GROUP_OBJECT_ID: ${{ secrets.ENTRA_WEBAPPEXECUTOR_GROUP_OBJECT_ID }}

jobs:
  validate:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bicep
        uses: azure/setup-bicep@v1

      - name: Lint Bicep
        run: |
          az bicep build --file bicep/main.bicep
          az bicep build --file bicep/sql.bicep
          az bicep build --file bicep/redis.bicep
          az bicep build --file bicep/appservice.bicep
          az bicep build --file bicep/frontdoor.bicep

      - name: Validate Deployment (What-If)
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: westus
          template: bicep/main.bicep
          parameters: >
            environment=${{ env.ENVIRONMENT }}
            location=${{ env.LOCATION }}
            entraManagerGroupObjectId=${{ env.ENTRA_MANAGER_GROUP_OBJECT_ID }}
            entraReaderGroupObjectId=${{ env.ENTRA_READER_GROUP_OBJECT_ID }}
            entraWebAppExecutorGroupObjectId=${{ env.ENTRA_WEBAPPEXECUTOR_GROUP_OBJECT_ID }}
          deploymentMode: Validate
          additionalArguments: --what-if

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment:
      name: ${{ env.ENVIRONMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: ${{ env.LOCATION }}
          template: bicep/main.bicep
          parameters: >
            environment=${{ env.ENVIRONMENT }}
            location=${{ env.LOCATION }}
            entraManagerGroupObjectId=${{ env.ENTRA_MANAGER_GROUP_OBJECT_ID }}
            entraReaderGroupObjectId=${{ env.ENTRA_READER_GROUP_OBJECT_ID }}
            entraWebAppExecutorGroupObjectId=${{ env.ENTRA_WEBAPPEXECUTOR_GROUP_OBJECT_ID }}
          deploymentMode: Incremental
          deploymentName: ewa-infra-${{ github.run_id }}

      - name: Output Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** ${{ env.LOCATION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- VNet + NAT Gateway (Static Outbound IP)" >> $GITHUB_STEP_SUMMARY
          echo "- Azure SQL Server (Entra ID Auth)" >> $GITHUB_STEP_SUMMARY
          echo "- Azure Managed Redis (Entra ID Auth)" >> $GITHUB_STEP_SUMMARY
          echo "- App Service (Linux + VNet Integration)" >> $GITHUB_STEP_SUMMARY
          echo "- Azure Front Door" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Post-Deployment Tasks" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure Entra ID database users via SQL query" >> $GITHUB_STEP_SUMMARY
          echo "2. Update App Service container image" >> $GITHUB_STEP_SUMMARY
          echo "3. Configure Front Door custom domain" >> $GITHUB_STEP_SUMMARY
