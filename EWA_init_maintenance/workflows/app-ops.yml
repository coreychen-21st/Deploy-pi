name: App Ops (Clone / Config)

on:
  workflow_call:
    inputs:
      action:
        description: Action to perform
        required: true
        type: string
        default: clone
      environment:
        description: Environment name
        required: true
        type: string
        default: prod
      source_subscription:
        description: Source subscription ID
        required: true
        type: string
      source_rg:
        description: Source resource group
        required: true
        type: string
      source_name:
        description: Source app service name
        required: true
        type: string
      target_subscription:
        description: Target subscription ID
        required: true
        type: string
      target_rg:
        description: Target resource group
        required: true
        type: string
      target_name:
        description: Target app service name
        required: true
        type: string
      location:
        description: Fallback location for new RG
        required: false
        type: string
        default: japanwest
      dry_run:
        description: Dry run mode
        required: true
        type: boolean
        default: true
      change_ticket:
        description: Change ticket number
        required: false
        type: string
        default: ''
      app_service_plan:
        description: App Service Plan ID or name
        required: false
        type: string
        default: ''
      app_runtime:
        description: Runtime stack (e.g., DOTNETCORE:8.0)
        required: false
        type: string
        default: DOTNETCORE:8.0
      docker_image:
        description: Docker image URI
        required: false
        type: string
        default: ''
      vnet_subnet_id:
        description: VNet subnet resource ID for integration
        required: false
        type: string
        default: ''
      vnet_id:
        description: VNet resource ID (used when subnet_id not provided)
        required: false
        type: string
        default: ''
      subnet_name:
        description: Subnet name for VNet integration
        required: false
        type: string
        default: ''
      clone_appsettings:
        description: Clone source app settings to target
        required: false
        type: boolean
        default: true
      clone_connectionstrings:
        description: Clone source connection strings to target
        required: false
        type: boolean
        default: true
      clone_iprestrictions:
        description: Clone source IP restrictions
        required: false
        type: boolean
        default: true
      skip_identity:
        description: Skip managed identity setup
        required: false
        type: boolean
        default: false
      skip_vnet:
        description: Skip VNet integration setup
        required: false
        type: boolean
        default: false
      slot_name:
        description: Deployment slot name (e.g., preview)
        required: false
        type: string
        default: ''
      swap_with_production:
        description: Swap slot with production after clone
        required: false
        type: boolean
        default: false
    secrets:
      AZURE_CLIENT_ID:
        description: OIDC client ID for target
        required: true
      AZURE_TENANT_ID:
        description: Azure tenant ID
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: Target subscription ID for login
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  id-token: write
  contents: read

jobs:
  app-ops:
    name: ${{ inputs.action }} ${{ inputs.source_name }} → ${{ inputs.target_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          ACTION="${{ inputs.action }}"
          TARGET_RG="${{ inputs.target_rg }}"
          TARGET_NAME="${{ inputs.target_name }}"
          LOCATION="${{ inputs.location }}"
          DRY_RUN="${{ inputs.dry_run }}"
          PLAN="${{ inputs.app_service_plan }}"

          echo "Action: $ACTION"
          echo "Target RG: $TARGET_RG"
          echo "Target Name: $TARGET_NAME"
          echo "Location: $LOCATION"
          echo "Dry Run: $DRY_RUN"

          if [[ "$ACTION" != "clone" && "$ACTION" != "delete" ]]; then
            echo "Invalid action: $ACTION"
            exit 1
          fi

          if [[ "$ACTION" == "delete" ]]; then
            echo "target_action=delete" >> "$GITHUB_OUTPUT"
          else
            echo "target_action=clone" >> "$GITHUB_OUTPUT"
          fi

          echo "target_rg=$TARGET_RG" >> "$GITHUB_OUTPUT"
          echo "target_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"

      - name: Azure Login (Target)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.target_subscription }}

      # ======================================================================
      # CLONE MODE
      # ======================================================================
      - name: Clone - Create Resource Group
        if: inputs.action == 'clone' && inputs.dry_run == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          LOCATION="${{ steps.validate.outputs.location }}"

          if az group show --name "$TARGET_RG" > /dev/null 2>&1; then
            echo "RG exists: $TARGET_RG"
          else
            echo "Creating RG: $TARGET_RG in $LOCATION"
            az group create --name "$TARGET_RG" --location "$LOCATION"
          fi

      - name: Clone - Create App Service Plan
        if: inputs.action == 'clone' && inputs.dry_run == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          PLAN_INPUT="${{ inputs.app_service_plan }}"
          LOCATION="${{ steps.validate.outputs.location }}"

          if [[ -z "$PLAN_INPUT" ]]; then
            PLAN_NAME="asp-${{ inputs.target_name }}"
          else
            PLAN_NAME="$PLAN_INPUT"
          fi

          echo "App Service Plan: $PLAN_NAME"

          if az appservice plan show --resource-group "$TARGET_RG" --name "$PLAN_NAME" > /dev/null 2>&1; then
            echo "Plan already exists: $PLAN_NAME"
          else
            echo "Creating plan: $PLAN_NAME"
            az appservice plan create \
              --resource-group "$TARGET_RG" \
              --name "$PLAN_NAME" \
              --is-linux \
              --sku P0v3 \
              --location "$LOCATION"
          fi

          echo "app_service_plan_name=$PLAN_NAME" >> "$GITHUB_OUTPUT"

      - name: Clone - Create App Service
        id: create-app
        if: inputs.action == 'clone' && inputs.dry_run == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"
          DOCKER_IMAGE="${{ inputs.docker_image }}"
          RUNTIME="${{ inputs.app_runtime }}"

          PLAN_NAME="$PLAN_NAME"
          if [[ -z "$PLAN_NAME" ]]; then
            PLAN_NAME="asp-$TARGET_NAME"
          fi

          if az webapp show --resource-group "$TARGET_RG" --name "$TARGET_NAME" > /dev/null 2>&1; then
            echo "App exists: $TARGET_NAME"
          else
            if [[ -n "$DOCKER_IMAGE" ]]; then
              echo "Creating with Docker: $DOCKER_IMAGE"
              az webapp create \
                --resource-group "$TARGET_RG" \
                --plan "$PLAN_NAME" \
                --name "$TARGET_NAME" \
                --container-image-name "$DOCKER_IMAGE" \
                --https-only true
            else
              echo "Creating with runtime: $RUNTIME"
              az webapp create \
                --resource-group "$TARGET_RG" \
                --plan "$PLAN_NAME" \
                --name "$TARGET_NAME" \
                --runtime "$RUNTIME" \
                --https-only true
            fi
          fi

      # ======================================================================
      # CONFIGURE APP SETTINGS
      # ======================================================================
      - name: Clone - Copy App Settings from Source
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.clone_appsettings == true
        shell: bash
        run: |
          SOURCE_RG="${{ inputs.source_rg }}"
          SOURCE_NAME="${{ inputs.source_name }}"
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          echo "Fetching app settings from $SOURCE_NAME..."

          SETTINGS_JSON=$(az webapp config appsettings list \
            --resource-group "$SOURCE_RG" \
            --name "$SOURCE_NAME" \
            --query "[?name != 'APPINSIGHTS_INSTRUMENTATIONKEY' && \
                      name != 'APPINSIGHTS_PROFILERFEATURE_VERSION' && \
                      name != 'APPINSIGHTS_SNAPSHOTFEATURE_VERSION' && \
                      name != 'APPLICATIONINSIGHTS_CONFIGURATION_CONTENT' && \
                      name != 'APPLICATIONINSIGHTS_CONNECTION_STRING' && \
                      name != 'ApplicationInsightsAgent_EXTENSION_VERSION' && \
                      name != 'DiagnosticServices_EXTENSION_VERSION' && \
                      name != 'InstrumentationEngine_EXTENSION_VERSION' && \
                      name != 'SnapshotDebugger_EXTENSION_VERSION' && \
                      name != 'XDT_MicrosoftApplicationInsights_BaseExtensions' && \
                      name != 'XDT_MicrosoftApplicationInsights_Mode' && \
                      name != 'XDT_MicrosoftApplicationInsights_PreemptSdk']" \
            -o json 2>/dev/null || echo "[]")

          if [[ "$SETTINGS_JSON" == "[]" ]]; then
            echo "No app settings to clone from source"
          else
            echo "$SETTINGS_JSON" | jq -r '.[] | "\(.name)=\(.value)"' > /tmp/settings.txt

            if [[ -s /tmp/settings.txt ]]; then
              while IFS='=' read -r name value; do
                echo "  Setting: $name"
              done < /tmp/settings.txt

              az webapp config appsettings set \
                --resource-group "$TARGET_RG" \
                --name "$TARGET_NAME" \
                --settings @<(echo "$SETTINGS_JSON" | jq -r '.[] | "\(.name)=\(.value)"')
            fi
          fi

      - name: Clone - Copy Connection Strings from Source
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.clone_connectionstrings == true
        shell: bash
        run: |
          SOURCE_RG="${{ inputs.source_rg }}"
          SOURCE_NAME="${{ inputs.source_name }}"
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          echo "Fetching connection strings from $SOURCE_NAME..."

          CONN_JSON=$(az webapp config connection-string list \
            --resource-group "$SOURCE_RG" \
            --name "$SOURCE_NAME" \
            -o json 2>/dev/null || echo "[]")

          if [[ "$CONN_JSON" == "[]" ]]; then
            echo "No connection strings to clone from source"
          else
            COUNT=$(echo "$CONN_JSON" | jq 'length')
            echo "Found $COUNT connection strings"

            echo "$CONN_JSON" | jq -r '.[] | "\(.name) type=\(.type)"'

            az webapp config connection-string set \
              --resource-group "$TARGET_RG" \
              --name "$TARGET_NAME" \
              --settings @<(echo "$CONN_JSON" | jq -r '.[] | "\(.name)=\(.value)"')
          fi

      # ======================================================================
      # MANAGED IDENTITY
      # ======================================================================
      - name: Clone - Enable Managed Identity
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.skip_identity == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          echo "Enabling System-Assigned Managed Identity..."

          PRINCIPAL_ID=$(az webapp identity assign \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --query "principalId" -o tsv)

          echo "identity_principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"
          echo "Managed Identity enabled: $PRINCIPAL_ID"

      # ======================================================================
      # GENERAL SETTINGS (HTTPS, TLS, FTPS, Always On)
      # ======================================================================
      - name: Clone - Configure General Settings
        if: inputs.action == 'clone' && inputs.dry_run == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"
          DOCKER_IMAGE="${{ inputs.docker_image }}"

          if [[ -n "$DOCKER_IMAGE" ]]; then
            az webapp config set \
              --resource-group "$TARGET_RG" \
              --name "$TARGET_NAME" \
              --linux-fx-version "DOCKER|$DOCKER_IMAGE" \
              --always-on true \
              --http20-enabled false \
              --min-tls-version "1.2" \
              --ftps-state "FtpsOnly" \
              --use-32bit-worker-process true \
              --web-sockets-enabled false \
              --startup-file ""
          else
            az webapp config set \
              --resource-group "$TARGET_RG" \
              --name "$TARGET_NAME" \
              --always-on true \
              --http20-enabled false \
              --min-tls-version "1.2" \
              --ftps-state "FtpsOnly" \
              --use-32bit-worker-process true \
              --web-sockets-enabled false \
              --startup-file ""
          fi

          az resource update \
            --resource-type Microsoft.Web/sites \
            --name "$TARGET_NAME" \
            --resource-group "$TARGET_RG" \
            --set properties.clientAffinityEnabled=false properties.clientAffinityProxyEnabled=false \
            --api-version 2024-11-01

          echo "General settings configured"

      # ======================================================================
      # IP RESTRICTIONS (Whitelist)
      # ======================================================================
      - name: Clone - Configure IP Restrictions (Whitelist)
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.clone_iprestrictions == true
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          echo "Configuring IP restrictions..."

          MAIN_RULES=$(az webapp config access-restriction show \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --query "ipSecurityRestrictions[?name!='DenyAll'].name" -o tsv 2>/dev/null || true)

          for rule in $MAIN_RULES; do
            echo "  Removing existing rule: $rule"
            az webapp config access-restriction remove \
              --resource-group "$TARGET_RG" \
              --name "$TARGET_NAME" \
              --rule-name "$rule" || true
          done

          echo "  Adding IP rules..."

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "Office_2F" \
            --priority 100 --action Allow \
            --ip-address "218.32.244.152/32" \
            --description "樂分期 2 樓"

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "IT_143_IP" \
            --priority 100 --action Allow \
            --ip-address "210.243.135.140/32" \
            --description "Allow-IT-143-IP"

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "AllowFrontDoor" \
            --priority 100 --action Allow \
            --service-tag "AzureFrontDoor.Backend"

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "Pi_OA" \
            --priority 101 --action Allow \
            --ip-address "59.124.7.175/32" \
            --description "Allow-Pi-OA"

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "Pitest_Internal" \
            --priority 102 --action Allow \
            --ip-address "4.190.186.188/32" \
            --description "Allow-pitest-internal"

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "Office_143_2F_1" \
            --priority 113 --action Allow \
            --ip-address "125.227.46.135/31" \
            --description "office_143_2f"

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "Office_143_2F_2" \
            --priority 123 --action Allow \
            --ip-address "219.70.120.125/32" \
            --description "office_143_2f"

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "Office_163" \
            --priority 133 --action Allow \
            --ip-address "210.242.238.172/32" \
            --description "office_163_2f3f5f8f10f"

          az webapp config access-restriction add \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --rule-name "Office_143_All" \
            --priority 143 --action Allow \
            --ip-address "219.86.43.106/31" \
            --description "office_143_2f3f5f8f10f"

          az webapp config access-restriction set \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --default-action Deny

          az webapp config access-restriction set \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --use-same-restrictions-for-scm-site false \
            --scm-default-action Allow

          echo "IP restrictions configured (9 rules, main site default=Deny, SCM=Allow)"

      # ======================================================================
      # VNET INTEGRATION
      # ======================================================================
      - name: Clone - Configure VNet Integration
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.skip_vnet == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          VNET_SUBNET_ID="${{ inputs.vnet_subnet_id }}"
          VNET_ID="${{ inputs.vnet_id }}"
          SUBNET_NAME="${{ inputs.subnet_name }}"

          if [[ -n "$VNET_SUBNET_ID" ]]; then
            az webapp vnet-integration add \
              --resource-group "$TARGET_RG" \
              --name "$TARGET_NAME" \
              --vnet "$VNET_ID" \
              --subnet "$SUBNET_NAME"

            echo "VNet Integration: $VNET_SUBNET_ID"
          elif [[ -n "$VNET_ID" && -n "$SUBNET_NAME" ]]; then
            az webapp vnet-integration add \
              --resource-group "$TARGET_RG" \
              --name "$TARGET_NAME" \
              --vnet "$VNET_ID" \
              --subnet "$SUBNET_NAME"

            echo "VNet Integration: $VNET_ID/$SUBNET_NAME"
          else
            echo "Skipping VNet Integration (no subnet configured)"
          fi

          az webapp config set \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --vnet-route-all-enabled true

          echo "VNet Route All enabled"

      # ======================================================================
      # DISABLE BASIC AUTH
      # ======================================================================
      - name: Clone - Disable Basic Auth (FTP/SCM)
        if: inputs.action == 'clone' && inputs.dry_run == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          az webapp update \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --basic-auth Disabled > /dev/null

          echo "Basic Auth disabled"

      # ======================================================================
      # LOGGING / DEBUGGING
      # ======================================================================
      - name: Clone - Configure Logging
        if: inputs.action == 'clone' && inputs.dry_run == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          az webapp log config \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --web-server-logging filesystem

          az webapp log config \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --detailed-error-messages false \
            --failed-request-tracing false

          az webapp config set \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --remote-debugging-enabled false

          echo "Logging configured"

      # ======================================================================
      # SLOT: Create Preview Slot (Blue-Green)
      # ======================================================================
      - name: Clone - Create Preview Slot
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.slot_name != ''
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"
          SLOT_NAME="${{ inputs.slot_name }}"

          echo "Creating deployment slot: $SLOT_NAME"

          az webapp deployment slot create \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --slot "$SLOT_NAME" \
            --configuration-source "$TARGET_NAME"

          echo "slot_created=true" >> "$GITHUB_OUTPUT"
          echo "Slot $SLOT_NAME created (config cloned from production)"

      # ======================================================================
      # SLOT: Clone App Settings + Connection Strings to Slot
      # ======================================================================
      - name: Clone - Clone Settings to Slot
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.slot_name != '' && inputs.clone_appsettings == true
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"
          SLOT_NAME="${{ inputs.slot_name }}"

          echo "Cloning app settings to slot $SLOT_NAME..."

          SETTINGS_JSON=$(az webapp config appsettings list \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --query "[?name != 'APPINSIGHTS_INSTRUMENTATIONKEY' && \
                      name != 'APPINSIGHTS_PROFILERFEATURE_VERSION' && \
                      name != 'APPINSIGHTS_SNAPSHOTFEATURE_VERSION' && \
                      name != 'APPLICATIONINSIGHTS_CONFIGURATION_CONTENT' && \
                      name != 'APPLICATIONINSIGHTS_CONNECTION_STRING' && \
                      name != 'ApplicationInsightsAgent_EXTENSION_VERSION' && \
                      name != 'DiagnosticServices_EXTENSION_VERSION' && \
                      name != 'InstrumentationEngine_EXTENSION_VERSION' && \
                      name != 'SnapshotDebugger_EXTENSION_VERSION' && \
                      name != 'XDT_MicrosoftApplicationInsights_BaseExtensions' && \
                      name != 'XDT_MicrosoftApplicationInsights_Mode' && \
                      name != 'XDT_MicrosoftApplicationInsights_PreemptSdk']" \
            -o json 2>/dev/null || echo "[]")

          if [[ "$SETTINGS_JSON" != "[]" ]]; then
            az webapp config appsettings set \
              --resource-group "$TARGET_RG" \
              --name "$TARGET_NAME" \
              --slot "$SLOT_NAME" \
              --settings @<(echo "$SETTINGS_JSON" | jq -r '.[] | "\(.name)=\(.value)"')
            echo "Slot settings cloned"
          fi

      - name: Clone - Clone Connection Strings to Slot
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.slot_name != '' && inputs.clone_connectionstrings == true
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"
          SLOT_NAME="${{ inputs.slot_name }}"

          CONN_JSON=$(az webapp config connection-string list \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            -o json 2>/dev/null || echo "[]")

          if [[ "$CONN_JSON" != "[]" ]]; then
            az webapp config connection-string set \
              --resource-group "$TARGET_RG" \
              --name "$TARGET_NAME" \
              --slot "$SLOT_NAME" \
              --settings @<(echo "$CONN_JSON" | jq -r '.[] | "\(.name)=\(.value)"')
            echo "Slot connection strings cloned"
          fi

      # ======================================================================
      # SWAP: Blue-Green Production Swap
      # ======================================================================
      - name: Swap - Swap Slot to Production
        if: inputs.action == 'clone' && inputs.dry_run == false && inputs.swap_with_production == true && inputs.slot_name != ''
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"
          SLOT_NAME="${{ inputs.slot_name }}"

          echo "Swapping $SLOT_NAME -> production (preview warm up)..."
          az webapp deployment slot swap \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --slot "$SLOT_NAME" \
            --target-slot production \
            --action preview

          echo "Production swap complete. New version now on production."

      # ======================================================================
      # RESTART
      # ======================================================================
      - name: Clone - Restart App Service
        if: inputs.action == 'clone' && inputs.dry_run == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          az webapp restart \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME"

          echo "App Service restarted"

      # ======================================================================
      # DELETE MODE
      # ======================================================================
      - name: Delete - Remove App Service
        if: inputs.action == 'delete' && inputs.dry_run == false
        shell: bash
        run: |
          TARGET_RG="${{ steps.validate.outputs.target_rg }}"
          TARGET_NAME="${{ steps.validate.outputs.target_name }}"

          echo "Deleting app: $TARGET_NAME"
          az webapp delete \
            --resource-group "$TARGET_RG" \
            --name "$TARGET_NAME" \
            --keep-empty-resource-group

          echo "App deleted"

      # ======================================================================
      # DRY RUN OUTPUT
      # ======================================================================
      - name: Dry Run - Show Configuration
        if: inputs.dry_run == true
        shell: bash
        run: |
          echo "=============================================="
          echo " DRY RUN - Configuration Preview"
          echo "=============================================="
          echo "Action:          ${{ inputs.action }}"
          echo "Source:          ${{ inputs.source_rg }}/${{ inputs.source_name }}"
          echo "Target:          ${{ inputs.target_subscription }}/${{ inputs.target_rg }}/${{ inputs.target_name }}"
          echo "Location:        ${{ inputs.location }}"
          echo "App Service Plan: ${{ inputs.app_service_plan }}"
          echo "Runtime/Docker:  ${{ inputs.app_runtime }} / ${{ inputs.docker_image }}"
          echo ""
          echo "Features:"
          echo "  Clone AppSettings:      ${{ inputs.clone_appsettings }}"
          echo "  Clone ConnectionStrings:${{ inputs.clone_connectionstrings }}"
          echo "  Clone IP Restrictions:  ${{ inputs.clone_iprestrictions }}"
          echo "  Skip Managed Identity:  ${{ inputs.skip_identity }}"
          echo "  Skip VNet Integration:  ${{ inputs.skip_vnet }}"
          echo ""
          echo "Slot:            ${{ inputs.slot_name }}"
          echo "Swap to Prod:    ${{ inputs.swap_with_production }}"
          echo ""

      - name: Summary
        shell: bash
        run: |
          echo "## App Ops Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Action | ${{ inputs.action }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | \`${{ inputs.source_rg }}/${{ inputs.source_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | \`${{ inputs.target_rg }}/${{ inputs.target_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry Run | ${{ inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Slot | ${{ inputs.slot_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Swap | ${{ inputs.swap_with_production }} |" >> "$GITHUB_STEP_SUMMARY"
